<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiragana voice test</title>
<style>
:root { --paper:#f7f1e3; --card:#fffdf7; --ink:#2b3a67; --soft:#5d6790; --red:#e4572e; --green:#7fb069; --line:#e2d7c1; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--paper); color:var(--ink); font:500 18px/1.35 system-ui, sans-serif; padding:16px 18px 90px; }
h1 { font-size:26px; margin:0 0 4px; }
p.lead { margin:0 0 12px; color:var(--soft); }
.jp { font-family:"Hiragino Mincho ProN","Noto Serif JP","Yu Mincho",serif; font-weight:600; }
.across { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; background:var(--card); border-radius:16px; padding:10px 12px; box-shadow:0 3px 0 rgba(60,45,20,.08); }
.across span { color:var(--soft); margin-right:4px; }
button { font:inherit; color:inherit; border:none; cursor:pointer; }
.k { min-width:56px; height:56px; border-radius:14px; background:var(--paper); font-size:30px; }
.k.playing { background:var(--red); color:#fff; }
.row { display:grid; grid-template-columns:56px minmax(180px,1fr) auto auto auto; align-items:center; gap:10px; background:var(--card); border-radius:16px; padding:8px 10px; margin-bottom:8px; box-shadow:0 3px 0 rgba(60,45,20,.08); border:3px solid transparent; }
.row.active { border-color:#f3c3b4; }
.row.picked { border-color:var(--green); background:#f1f8ec; }
.letter { width:52px; height:52px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; font-weight:800; font-size:24px; }
.label { font-size:17px; }
.label b { font-size:19px; }
.play { height:56px; padding:0 20px; border-radius:999px; background:var(--ink); color:#fff; font-weight:700; }
.chips { display:flex; gap:6px; }
.chips .k { min-width:46px; height:52px; font-size:24px; }
.pick { height:56px; padding:0 18px; border-radius:999px; background:var(--paper); font-weight:700; }
.row.picked .pick { background:var(--green); color:#fff; }
.result { position:fixed; left:0; right:0; bottom:0; background:var(--ink); color:#fff; padding:16px 20px; font-size:20px; font-weight:700; text-align:center; }
@media (max-width:1100px) { .row { grid-template-columns:52px 1fr auto auto; } .chips { grid-column:1 / -1; flex-wrap:wrap; } }
</style></head><body>
<h1>Which hiragana voice sounds best?</h1>
<p class="lead">Tap <b>▶ Play all</b> on each row, or tap a sound below to hear it in every version one after another. Then tap <b>Pick</b> on your favourite and tell Claude its letter.</p>
<div class="across"><span>Hear one sound in every version:</span><div id="across"></div><button class="pick" id="stop">■ Stop</button></div>
<div id="rows"></div>
<div class="result" id="result">Nothing picked yet</div>
<script>
const M = {"sounds": ["あ", "い", "う", "く", "す", "つ", "し", "か"], "rows": [{"id": "A", "label": "四国めたん — what the game uses now", "files": ["audio/A-a.mp3", "audio/A-i.mp3", "audio/A-u.mp3", "audio/A-ku.mp3", "audio/A-su.mp3", "audio/A-tsu.mp3", "audio/A-shi.mp3", "audio/A-ka.mp3"]}, {"id": "B", "label": "四国めたん (same voice) — natural length, clean volume", "files": ["audio/B-a.mp3", "audio/B-i.mp3", "audio/B-u.mp3", "audio/B-ku.mp3", "audio/B-su.mp3", "audio/B-tsu.mp3", "audio/B-shi.mp3", "audio/B-ka.mp3"]}, {"id": "C", "label": "四国めたん (same voice) — a little slower, clean volume", "files": ["audio/C-a.mp3", "audio/C-i.mp3", "audio/C-u.mp3", "audio/C-ku.mp3", "audio/C-su.mp3", "audio/C-tsu.mp3", "audio/C-shi.mp3", "audio/C-ka.mp3"]}, {"id": "D", "label": "春日部つむぎ (Mochi) — natural length, clean volume", "files": ["audio/D-a.mp3", "audio/D-i.mp3", "audio/D-u.mp3", "audio/D-ku.mp3", "audio/D-su.mp3", "audio/D-tsu.mp3", "audio/D-shi.mp3", "audio/D-ka.mp3"]}, {"id": "E", "label": "雨晴はう — natural length, clean volume", "files": ["audio/E-a.mp3", "audio/E-i.mp3", "audio/E-u.mp3", "audio/E-ku.mp3", "audio/E-su.mp3", "audio/E-tsu.mp3", "audio/E-shi.mp3", "audio/E-ka.mp3"]}, {"id": "F", "label": "九州そら — natural length, clean volume", "files": ["audio/F-a.mp3", "audio/F-i.mp3", "audio/F-u.mp3", "audio/F-ku.mp3", "audio/F-su.mp3", "audio/F-tsu.mp3", "audio/F-shi.mp3", "audio/F-ka.mp3"]}, {"id": "G", "label": "東北きりたん — natural length, clean volume", "files": ["audio/G-a.mp3", "audio/G-i.mp3", "audio/G-u.mp3", "audio/G-ku.mp3", "audio/G-su.mp3", "audio/G-tsu.mp3", "audio/G-shi.mp3", "audio/G-ka.mp3"]}, {"id": "H", "label": "もち子さん — natural length, clean volume", "files": ["audio/H-a.mp3", "audio/H-i.mp3", "audio/H-u.mp3", "audio/H-ku.mp3", "audio/H-su.mp3", "audio/H-tsu.mp3", "audio/H-shi.mp3", "audio/H-ka.mp3"]}, {"id": "I", "label": "春歌ナナ — natural length, clean volume", "files": ["audio/I-a.mp3", "audio/I-i.mp3", "audio/I-u.mp3", "audio/I-ku.mp3", "audio/I-su.mp3", "audio/I-tsu.mp3", "audio/I-shi.mp3", "audio/I-ka.mp3"]}]};
const audio = {};
M.rows.forEach(r => r.files.forEach(f => { const a = new Audio(f); a.preload = 'auto'; audio[f] = a; }));
let run = 0;
const wait = (ms) => new Promise(r => setTimeout(r, ms));
function playFile(f) {
  return new Promise(res => {
    const a = audio[f]; a.currentTime = 0;
    a.onended = res; a.onerror = res;
    const p = a.play(); if (p && p.catch) p.catch(res);
  });
}
function stopAll() { run++; Object.values(audio).forEach(a => { a.pause(); }); document.querySelectorAll('.playing').forEach(x => x.classList.remove('playing')); document.querySelectorAll('.row.active').forEach(x => x.classList.remove('active')); }
async function sequence(items) {
  stopAll(); const me = ++run;
  for (const [f, chip, row] of items) {
    if (me !== run) return;
    chip && chip.classList.add('playing'); row && row.classList.add('active');
    await playFile(f);
    chip && chip.classList.remove('playing'); row && row.classList.remove('active');
    if (me !== run) return;
    await wait(650);
  }
}
let picked = null;
try { picked = localStorage.getItem('voicePick'); } catch (e) {}
const rowsEl = document.getElementById('rows');
const rowEls = {};
M.rows.forEach(r => {
  const row = document.createElement('div'); row.className = 'row'; rowEls[r.id] = row;
  const [name, desc] = r.label.split(' — ');
  row.innerHTML = `<div class="letter">${r.id}</div><div class="label"><b class="jp">${name}</b><br>${desc || ''}</div>`;
  const play = document.createElement('button'); play.className = 'play'; play.textContent = '▶ Play all';
  const chips = document.createElement('div'); chips.className = 'chips';
  const chipEls = r.files.map((f, i) => { const b = document.createElement('button'); b.className = 'k jp'; b.textContent = M.sounds[i]; b.onclick = () => sequence([[f, b, row]]); chips.append(b); return b; });
  play.onclick = () => sequence(r.files.map((f, i) => [f, chipEls[i], row]));
  const pick = document.createElement('button'); pick.className = 'pick'; pick.textContent = '☆ Pick';
  pick.onclick = () => { picked = r.id; try { localStorage.setItem('voicePick', r.id); } catch (e) {} showPick(); };
  row.append(play, chips, pick); rowsEl.append(row);
});
const across = document.getElementById('across');
M.sounds.forEach((s, i) => {
  const b = document.createElement('button'); b.className = 'k jp'; b.textContent = s;
  b.onclick = () => sequence(M.rows.map(r => [r.files[i], b, rowEls[r.id]]));
  across.append(b); across.append(' ');
});
document.getElementById('stop').onclick = stopAll;
function showPick() {
  Object.entries(rowEls).forEach(([id, el]) => { el.classList.toggle('picked', id === picked); el.querySelector('.pick').textContent = id === picked ? '★ Picked' : '☆ Pick'; });
  const r = M.rows.find(x => x.id === picked);
  document.getElementById('result').textContent = r ? `You picked ${r.id}: ${r.label.split(' — ')[0]}. Tell Claude “${r.id}”.` : 'Nothing picked yet';
}
showPick();
</script></body></html>
